# Moves the GitHub Action's major tag (`v0`) to each release, so `BeyondFolder/assertrust@v0`
# runs the newest one. It runs after the Release workflow (release.yml, generated by dist)
# succeeds for a tag push. A prerelease (`v0.2.0-rc.1`) leaves the tag where it is.
name: Move the Action's tag

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

jobs:
  move:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Move the major tag to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-*) echo "$TAG is a prerelease: the major tag stays"; exit 0 ;;
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "$TAG isn't a release tag"; exit 0 ;;
          esac
          major="${TAG%%.*}"
          if gh api "repos/$REPO/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$REPO/git/refs/tags/$major" -f sha="$SHA" -F force=true
          else
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$major" -f sha="$SHA"
          fi
          echo "$major now points to $TAG ($SHA)"
