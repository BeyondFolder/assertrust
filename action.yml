name: assertrust
description: "Flags changes that weaken a test suite: removed checks, looser matchers, skipped tests, CI that lets failures through."
author: BeyondFolder
branding:
  icon: shield
  color: orange

inputs:
  version:
    description: The assertrust release to run, like `0.1.0`. By default, the one this action's tag was released with.
    default: ""
  fail-on:
    description: Fail the job on findings this sure or surer, `high`, `medium` or `low`. By default it only warns, unless `fail-on` is set in assertrust.toml.
    default: ""
  comment:
    description: Post the summary as one comment on the pull request once there are findings, and keep it updated on every push.
    default: "true"
  judge:
    description: Ask the AI judge about each finding, `true` to turn it on (or `[judge]` in assertrust.toml). It sends the code to the model's provider with your key, set on this step as an environment variable, like `ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}`. Its verdicts are cached between runs.
    default: "false"
  judge-model:
    description: The judge's model, as provider/model, like `anthropic/claude-haiku-5-5`. By default, assertrust.toml's or the built-in one.
    default: ""
  judge-effort:
    description: How hard the judge's model thinks, `low`, `medium` or `high`. By default, assertrust.toml's, else `medium` for the built-in model and the model's own default for any other.
    default: ""
  args:
    description: More arguments for `assertrust check`, split on spaces and lines. A `--range` here replaces the one worked out from the event, and a `--fail-on` the input.
    default: ""
  path:
    description: Run this assertrust binary instead of downloading a release.
    default: ""
  github-token:
    description: The token that posts the pull request comment. The comment is found again on the next push only when a bot posted it, like the workflow's own token or a GitHub App's.
    default: ${{ github.token }}

outputs:
  findings:
    description: How many findings the check listed (not counting allowed or hidden ones).
    value: ${{ steps.run.outputs.findings }}

runs:
  using: composite
  steps:
    # The judge's verdicts, so a change judged before keeps its verdict and costs nothing.
    - name: Restore the judge's verdicts
      if: inputs.judge == 'true' || hashFiles('assertrust.toml') != ''
      uses: actions/cache/restore@v6
      with:
        path: .assertrust/cache/judge
        key: assertrust-judge-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: assertrust-judge-
    - name: Run assertrust
      id: run
      shell: bash
      run: '"$GITHUB_ACTION_PATH/action/run.sh"'
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_JUDGE: ${{ inputs.judge }}
        INPUT_JUDGE_MODEL: ${{ inputs.judge-model }}
        INPUT_JUDGE_EFFORT: ${{ inputs.judge-effort }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_PATH: ${{ inputs.path }}
        GH_TOKEN: ${{ inputs.github-token }}
    - name: Keep the judge's verdicts
      if: always() && hashFiles('.assertrust/cache/judge/*.json') != ''
      uses: actions/cache/save@v6
      with:
        path: .assertrust/cache/judge
        key: assertrust-judge-${{ github.run_id }}-${{ github.run_attempt }}
