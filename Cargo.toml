[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/BeyondFolder/assertrust"

[workspace.dependencies]
assertrust-git = { path = "crates/assertrust-git" }
assertrust-ir = { path = "crates/assertrust-ir" }
assertrust-match = { path = "crates/assertrust-match" }
assertrust-rules = { path = "crates/assertrust-rules" }
clap = { version = "4.6", features = ["derive"] }
globset = "0.4.21"
insta = "1.49"
oxc = { version = "0.155", features = ["ast_visit", "codegen", "semantic"] }
serde_json = "1.0.154"
tempfile = "3.27"
toml = { version = "~1.1.8", default-features = false, features = ["std", "serde", "parse"] }
yaml-rust2 = "0.13.0"

[workspace.lints.rust]
unsafe_code = "forbid"
